name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "build/BassLeveler_artefacts/Release/VST3/Bass Leveler.vst3"
          codesign --force --deep --sign - "build/BassLeveler_artefacts/Release/Standalone/Bass Leveler.app"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/BassLeveler_artefacts/Release/VST3/Bass Leveler.vst3" dist/
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp "build/BassLeveler_artefacts/Release/Standalone/Bass Leveler.exe" dist/
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "build/BassLeveler_artefacts/Release/Standalone/Bass Leveler.app" dist/
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BassLeveler-${{ matrix.name }}
          path: dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
